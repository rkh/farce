name: Linux gems

on:
  push:
    branches: ['codex/update-liburing']
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_WITHOUT: compatibility:benchmark:test:docs

concurrency:
  group: linux-gems-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Select Linux gem platforms
        id: matrix
        run: |
          bundle exec ruby -rrake -rjson -e 'load "Rakefile"; puts "platforms=#{JSON.generate(CROSS_PLATFORMS.grep(/-linux-/))}"' >> "$GITHUB_OUTPUT"

  build:
    name: Build / ${{ matrix.platform }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby

      - name: Locate JRuby JAR
        run: ruby -rjruby -e 'File.open(ENV.fetch("GITHUB_ENV"), "a") { it.puts "JRUBY_JAR=#{JRuby.runtime.jruby_home}/lib/jruby.jar" }'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Build and verify platform gem
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: bundle exec rake "gem:$RELEASE_PLATFORM"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-gem-${{ matrix.platform }}
          path: pkg/*.gem
          if-no-files-found: error
          retention-days: 7
