name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ matrix.ruby.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - name: "3.4"
            version: "3.4"
          - name: "4.0"
            version: "4.0"
          - name: 4.1-dev
            version: head
          - name: jruby
            version: jruby
            verify_gems: true
            # Avoid virtual-thread starvation during pool growth on Java 21.
            jruby_opts: --debug -Xfiber.vthread=false
            # Integration load-order probes each start a fresh JVM.
            test_timeout: 1200
          - name: jruby-dev
            version: jruby-head
            jruby_opts: --debug -Xfiber.vthread=false
            test_timeout: 1200
          - name: truffleruby
            version: truffleruby
            test_timeout: 600
          - name: truffleruby-dev
            version: truffleruby-head
            test_timeout: 600
          - name: truffleruby+graalvm
            version: truffleruby+graalvm
            # Each subprocess starts a fresh JVM, which can exceed 15 seconds on CI.
            subprocess_timeout: 60
            test_timeout: 1200

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby.version }}

      - run: bundle install
      - run: bundle exec rake ci
        env:
          FARCE_VERIFY_GEMS: ${{ matrix.ruby.verify_gems || false }}
          JRUBY_OPTS: ${{ matrix.ruby.jruby_opts || '' }}
          TEST_TIMEOUT: ${{ matrix.ruby.test_timeout || 300 }}
          TEST_SUBPROCESS_TIMEOUT: ${{ matrix.ruby.subprocess_timeout || 15 }}

  windows:
    name: Windows / Ruby ${{ matrix.ruby }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        ruby: ["4.0"]

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install dependencies
        shell: pwsh
        run: |
          Remove-Item Gemfile.lock
          bundle install

      - run: bundle exec rake ci
        env:
          TEST_TIMEOUT: 300

  arm:
    name: ${{ matrix.os.name }} ARM / Ruby 4.0
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-24.04-arm
          - name: Windows
            runner: windows-11-arm
          - name: macOS
            runner: macos-15

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Remove incompatible lockfile on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item Gemfile.lock

      - run: bundle install
      - run: bundle exec rake ci
        env:
          TEST_TIMEOUT: 300

