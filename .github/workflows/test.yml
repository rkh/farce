name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ matrix.ruby.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - name: "3.4"
            version: "3.4"
          - name: "4.0"
            version: "4.0"
          - name: 4.1-dev
            version: head
          - name: jruby
            version: jruby
            verify_gems: true
            # Avoid virtual-thread starvation during pool growth on Java 21.
            jruby_opts: --debug -Xfiber.vthread=false
            # Integration load-order probes each start a fresh JVM.
            test_timeout: 1200
          - name: jruby-dev
            version: jruby-head
            jruby_opts: --debug -Xfiber.vthread=false
            test_timeout: 1200
          - name: truffleruby
            version: truffleruby
            test_timeout: 1200
          - name: truffleruby-dev
            version: truffleruby-head
            test_timeout: 1200
          - name: truffleruby+graalvm
            version: truffleruby+graalvm
            # Each subprocess starts a fresh JVM, which can exceed 15 seconds on CI.
            subprocess_timeout: 60
            test_timeout: 1200

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby.version }}

      - run: bundle install
      - name: Compile and test
        run: |
          if [[ "${{ matrix.ruby.version }}" == "3.4" ]]; then
            # Reduce exposure to Ruby 3.4's unsynchronized shared fiber stack pool.
            # https://github.com/ruby/ruby/commit/5b3f1c4c51480cbdbd1ace92b1767f14f9fff280
            test_cpu=$(awk '/Cpus_allowed_list/ { sub(/[-,].*/, "", $2); print $2 }' /proc/self/status)
            taskset --cpu-list "$test_cpu" bundle exec rake ci
          else
            bundle exec rake ci
          fi
        env:
          FARCE_VERIFY_GEMS: ${{ matrix.ruby.verify_gems || false }}
          JRUBY_OPTS: ${{ matrix.ruby.jruby_opts || '' }}
          TEST_TIMEOUT: ${{ matrix.ruby.test_timeout || 300 }}
          TEST_SUBPROCESS_TIMEOUT: ${{ matrix.ruby.subprocess_timeout || 15 }}

  futex:
    name: Linux / required io_uring futex / Ruby ${{ matrix.ruby.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - name: "4.0"
            version: "4.0"
          - name: 4.1-dev
            version: head
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby.version }}
      - name: Build pinned liburing with futex helpers
        shell: bash
        run: |
          set -euo pipefail
          read -r futex_version futex_sha256 < <(ruby -r./rakelib/liburing -e 'puts [Liburing::VERSION, Liburing::SHA256].join(" ")')
          futex_archive="$RUNNER_TEMP/liburing-$futex_version.tar.gz"
          futex_prefix="$RUNNER_TEMP/futex-liburing"
          curl --fail --location --retry 3 https://github.com/axboe/liburing/archive/refs/tags/liburing-$futex_version.tar.gz -o "$futex_archive"
          echo "$futex_sha256  $futex_archive" | sha256sum --check
          tar -xzf "$futex_archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/liburing-liburing-$futex_version"
          ./configure --prefix="$futex_prefix"
          make -j2
          make install
          echo "CPATH=$futex_prefix/include${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$futex_prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$futex_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$futex_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - run: bundle install
      - run: bundle exec rake compile
      - name: Record Linux futex environment
        run: |
          uname -a
          ldd --version
          pkg-config --modversion liburing
          ruby -v
          cat /proc/sys/kernel/io_uring_disabled
      - name: Require native and io_uring futex coverage without skips
        shell: bash
        run: |
          set -o pipefail
          bundle exec rake test 2>&1 | tee futex-tests.log
          grep -Eq '[1-9][0-9]* tests, [1-9][0-9]* assertions, 0 failures, 0 errors, 0 skips' futex-tests.log
        env:
          TEST: test/farce/internal/test_futex.rb
          FARCE_FIBER_SCHEDULER: io_uring
          BACKEND: io_uring
          REQUIRE_FUTEX: "1"
      - name: Run synchronization and scheduler regressions
        run: bundle exec rake test
        env:
          TEST: test/farce/internal/test_signal.rb,test/farce/test_signal.rb,test/farce/test_lock.rb,test/farce/internal/test_atom.rb,test/farce/internal/test_map.rb,test/farce/internal/test_vector.rb,test/farce/internal/test_tree_map.rb,test/farce/test_priority_queue.rb,test/farce/internal/test_fiber_scheduler_lifetime.rb
          FARCE_FIBER_SCHEDULER: io_uring
          BACKEND: io_uring
          REQUIRE_FUTEX: "1"

  futex-fallback:
    name: Linux / forced futex fallback / Ruby 4.0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Install io_uring headers
        run: sudo apt-get update && sudo apt-get install -y liburing-dev
      - run: bundle install
      - name: Compile with futex support disabled
        run: bundle exec rake compile
        env:
          CONFIGURE_ARGS: --disable-futex
      - name: Require forced-fallback coverage without skips
        shell: bash
        run: |
          set -o pipefail
          bundle exec rake test 2>&1 | tee futex-fallback-tests.log
          grep -Eq '[1-9][0-9]* tests, [1-9][0-9]* assertions, 0 failures, 0 errors, 0 skips' futex-fallback-tests.log
        env:
          TEST: test/farce/internal/test_futex.rb
          TESTOPTS: --name=/TestFutexFallback/
          FARCE_FIBER_SCHEDULER: io_uring
          BACKEND: io_uring
          REQUIRE_FUTEX: "0"
      - name: Run fallback synchronization and scheduler regressions
        run: bundle exec rake test
        env:
          TEST: test/farce/internal/test_signal.rb,test/farce/test_signal.rb,test/farce/test_lock.rb,test/farce/internal/test_atom.rb,test/farce/internal/test_map.rb,test/farce/internal/test_vector.rb,test/farce/internal/test_tree_map.rb,test/farce/test_priority_queue.rb,test/farce/internal/test_fiber_scheduler_lifetime.rb
          FARCE_FIBER_SCHEDULER: io_uring
          BACKEND: io_uring
          REQUIRE_FUTEX: "0"

  windows:
    name: Windows / Ruby ${{ matrix.ruby }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        ruby: ["4.0"]

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install dependencies
        shell: pwsh
        run: |
          Remove-Item Gemfile.lock
          bundle install

      - name: Configure Windows crash reports
        shell: pwsh
        run: ./.github/scripts/configure-windows-crash-reports.ps1

      - run: bundle exec rake ci
        env:
          TEST_TIMEOUT: 1200

      - name: Upload Windows crash reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ruby-crashes-Windows-${{ runner.arch }}-${{ matrix.ruby }}
          path: ${{ runner.temp }}/farce-crash-reports/
          if-no-files-found: ignore
          retention-days: 7

  arm:
    name: ${{ matrix.os.name }} ARM / Ruby 4.0
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-24.04-arm
          - name: Windows
            runner: windows-11-arm
          - name: macOS
            runner: macos-15

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Remove incompatible lockfile on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item Gemfile.lock

      - run: bundle install
      - name: Configure Windows crash reports
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/configure-windows-crash-reports.ps1

      - run: bundle exec rake ci
        env:
          TEST_TIMEOUT: 1200

      - name: Upload Windows crash reports
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ruby-crashes-Windows-${{ runner.arch }}-4.0
          path: ${{ runner.temp }}/farce-crash-reports/
          if-no-files-found: ignore
          retention-days: 7

