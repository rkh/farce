name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ matrix.ruby.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - name: "3.4"
            version: "3.4"
          - name: "4.0"
            version: "4.0"
          - name: 4.1-dev
            version: head
          - name: jruby
            version: jruby
            verify_gems: true
            # Avoid virtual-thread starvation during pool growth on Java 21.
            jruby_opts: -Xfiber.vthread=false
            # Leave headroom for the full suite and JVM subprocess startup on CI.
            test_timeout: 300
          - name: jruby-dev
            version: jruby-head
            # Avoid virtual-thread starvation during nested fiber creation.
            jruby_opts: -Xfiber.vthread=false
            # Match stable JRuby's allowance for the full suite and JVM startup.
            test_timeout: 300
          - name: truffleruby
            version: truffleruby
          - name: truffleruby-dev
            version: truffleruby-head
          - name: truffleruby+graalvm
            version: truffleruby+graalvm
            test_timeout: 300

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby.version }}

      - run: bundle install
      - run: bundle exec rake ci
        env:
          FARCE_VERIFY_GEMS: ${{ matrix.ruby.verify_gems || false }}
          JRUBY_OPTS: ${{ matrix.ruby.jruby_opts || '' }}
          TEST_TIMEOUT: ${{ matrix.ruby.test_timeout || 120 }}

  windows:
    name: Windows / Ruby ${{ matrix.ruby }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install dependencies
        shell: pwsh
        run: |
          Remove-Item Gemfile.lock
          bundle install

      - run: bundle exec rake ci
        env:
          TEST_TIMEOUT: 300
